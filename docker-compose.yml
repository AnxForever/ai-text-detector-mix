services:
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./models:/app/models:ro
      - ./api/api.py:/app/api.py:ro
      - ./datasets/feedback_loop:/app/datasets/feedback_loop
    env_file:
      - .env.deploy
    environment:
      - DETECTOR_CLASSIFIER_MODEL=models/bert_v11c_boundary_fix
      - DETECTOR_SPAN_MODEL=models/bert_span_detector
      - DETECTOR_FEEDBACK_DIR=/app/datasets/feedback_loop
    mem_limit: 1500m
    mem_reservation: 700m
    memswap_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    # Uncomment for GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    mem_limit: 100m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
    depends_on:
      - backend
    restart: unless-stopped
