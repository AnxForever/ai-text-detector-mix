# GPT 模板（映射 2000+ -> 1000-2000）
# 生成时间: 2026-01-28
# 说明: 保留主题，缩短字数范围；spec 已映射为脚本支持的 list/guide/report，保留 spec_like 标记。

- id: A_spec_001
  scenario_id: A
  style_plan: list
  length_bucket: 500-1000
  notes: "spec_like=1; mapped_from=spec"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约700–900字。
    - 主题：{课程/实验主题}；正文需体现“实验操作规程与参数规范”。
    - 至少包含：步骤清单≥6条；参数/阈值≥6个（含范围或具体值）；异常场景≥2个（含现象+处理）；验收标准≥3条（可量化）。
    【NICE】
    - 增加“注意事项”条目≥6条。
    - 用“参数—取值/范围—理由”的条目结构写参数部分。
    - 增加1段“常见错误排查路径”（3–5步）。

- id: A_expl_002
  scenario_id: A
  style_plan: explanation
  length_bucket: 200-500
  notes: ""
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约260–420字。
    - 主题：{概念/方法名}；需要与{对比概念}做对比说明。
    - 必须包含：1个精确定义；1个对比例子；“常见误区”条目≥3条；量化条件/阈值≥2处（例如“当…>…时”）。
    【NICE】
    - 增加“适用场景/不适用场景”各1条（带条件）。
    - 增加1句“如何快速判断是否满足前提”的提示。

- id: A_long_003
  scenario_id: A
  style_plan: report
  length_bucket: 1000-2000
  notes: ""
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约1200–1800字。
    - 主题：{研究问题}；任务：{分类/检测/对比}；写作风格：课程论文/实验报告的“方法+结果+讨论”。
    - 必须包含：对比实验≥2组；具体数值≥6个（指标/样本量/超参等）；条目化结论≥4条；局限性+改进方向≥2条；误差分析≥1段（点名“哪类文本/哪种文风”更易错）。
    【NICE】
    - 增加1段“消融/对照”的描述（至少1个数值）。
    - 增加1段“阈值选择/校准”的说明（含阈值）。

