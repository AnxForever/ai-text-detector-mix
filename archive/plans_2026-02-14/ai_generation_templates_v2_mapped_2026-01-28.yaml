    - 中段至少2段条目清单（每段≥6条）；具体数字≥3个；可验证判断标准≥2个（含阈值/条件）；结尾可执行建议≥8条（按人群分组）。
    【NICE】
    - 增加1段“反方观点/常见反驳”并回应（含1个数值或条件）。
