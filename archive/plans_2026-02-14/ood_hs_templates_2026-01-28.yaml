# OOD_HS 模板（legal/finance）
# 生成时间: 2026-01-28

- id: HS_LEGAL_LIST_01
  scenario_id: B
  style_plan: list
  length_bucket: 500-1000
  notes: "spec_like=1"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、免责声明/拒绝表述。
    - 字数约650–950字。
    - 主题为“数据脱敏处理规范”。
    - 必须包含：规则条目≥8条；处罚/责任条款≥2条（含阈值或触发条件）；审批流程≥3步。

- id: HS_LEGAL_REPORT_02
  scenario_id: B
  style_plan: report
  length_bucket: 1000-2000
  notes: "spec_like=1"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、免责声明/拒绝表述。
    - 字数约1200–1800字。
    - 写“合规整改通报/内部合规报告”。
    - 必须包含：背景+范围+问题概述；整改措施≥6条（含负责人{姓名}与期限{日期}）；风险评估≥2条（含阈值）。

