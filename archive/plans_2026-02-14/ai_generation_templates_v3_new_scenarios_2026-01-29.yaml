# 新场景模板 - 学术/社交/创意/技术
# 生成时间: 2026-01-29
# 说明: 补充缺失的文本类型场景

# ========== G: 学术论文/科研 ==========

- id: G_abstract_001
  scenario_id: G
  style_plan: report
  length_bucket: 200-500
  notes: "学术摘要"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约280–450字。
    - 写一篇学术论文摘要，研究领域：{研究领域}，研究主题：{研究主题}。
    - 必须包含：研究背景（1-2句）；研究目的；研究方法；主要发现（含≥2个数据）；结论（1-2句）。
    - 使用学术语言风格，避免口语化表达。
    【NICE】
    - 增加"创新点"说明。
    - 增加"关键词"≥4个。

- id: G_intro_002
  scenario_id: G
  style_plan: explanation
  length_bucket: 500-1000
  notes: "论文引言"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约600–900字。
    - 写一段论文引言，研究领域：{研究领域}，研究问题：{研究问题}。
    - 必须包含：研究背景；研究现状（引用≥3个研究/观点）；研究空白/问题；研究目的；研究意义。
    - 使用"有研究表明""学者指出""现有方法存在"等学术表达。
    【NICE】
    - 增加国内外研究对比。
    - 逻辑递进清晰（从宏观到具体）。

- id: G_method_003
  scenario_id: G
  style_plan: list
  length_bucket: 500-1000
  notes: "研究方法"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约600–900字。
    - 写一段研究方法描述，研究类型：{实验/调查/案例}，研究对象：{研究对象}。
    - 必须包含：数据来源；样本选取（含数量≥1个）；研究工具/方法≥2种；数据分析方法；有效性/可靠性说明。
    【NICE】
    - 增加"伦理声明"。
    - 增加变量操作定义。

- id: G_discussion_004
  scenario_id: G
  style_plan: mixed
  length_bucket: 1000-2000
  notes: "讨论与结论"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约1200–1800字。
    - 写论文的讨论与结论部分，研究主题：{研究主题}，主要发现：{发现1}、{发现2}。
    - 必须包含：主要发现总结≥3条；与已有研究对比≥2处；理论贡献≥2点；实践启示≥2点；研究局限≥2条；未来研究方向≥2条。
    【NICE】
    - 增加意外发现的讨论。
    - 增加具体数据支撑。

