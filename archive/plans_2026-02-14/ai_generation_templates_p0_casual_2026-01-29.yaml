# P0修复模板 - 口语化/有缺陷AI样本
# 目的: 打破"口语=Human"和"不完美=Human"的错误特征
# 生成时间: 2026-01-29

# ========== K: 口语化AI文本 ==========

- id: K_casual_chat_001
  scenario_id: K
  style_plan: mixed
  length_bucket: 80-200
  notes: "口语聊天风格"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约100–180字。
    - 写一段口语化的日常聊天内容，话题：{日常话题}。
    - 必须使用：语气词（啊、呢、吧、嘛）；口语缩略（咋、啥、咱）；网络用语。
    - 可以有：重复词、省略句、不完整句子。
    - 风格：像朋友之间发微信一样随意自然。
    【NICE】
    - 增加表情或emoji。

- id: K_casual_opinion_002
  scenario_id: K
  style_plan: mixed
  length_bucket: 200-500
  notes: "口语化观点表达"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约250–450字。
    - 用口语化方式表达对{话题}的看法。
    - 必须使用：口语连接词（然后、就是、反正、不过）；个人化表达（我觉得、我感觉、说实话）；语气助词。
    - 可以有：话题跳跃、补充说明、口语化重复强调。
    - 禁止：使用书面语连接词（因此、综上所述、鉴于）。
    【NICE】
    - 加入个人经历或身边例子。

- id: K_casual_story_003
  scenario_id: K
  style_plan: mixed
  length_bucket: 200-500
  notes: "口语化叙事"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约250–450字。
    - 用口语化方式讲述一件{事件类型}的经历。
    - 必须使用：时间口语（那天、后来、结果）；口语转折（但是吧、不过呢）；感叹语气（哎、唉、哈哈）。
    - 可以有：场景描写不完整、对话用直接引语、情绪词多。
    - 风格：像跟朋友讲故事一样。
    【NICE】
    - 增加心理活动描写。

- id: K_casual_recommend_004
  scenario_id: K
  style_plan: mixed
  length_bucket: 200-500
  notes: "口语化推荐"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约250–450字。
    - 用口语化方式推荐{推荐对象}。
    - 必须使用：强调语气（真的、超级、巨、特别）；口语化对比（比xxx强多了、秒杀）；个人体验词（我用了、亲测）。
    - 可以有：优缺点混说、话题跳跃、补充吐槽。
    - 禁止：使用测评报告式结构化语言。
    【NICE】
    - 增加使用场景描述。

- id: K_casual_complain_005
  scenario_id: K
  style_plan: mixed
  length_bucket: 80-200
  notes: "口语化吐槽"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约100–180字。
    - 用口语化方式吐槽{吐槽对象}。
    - 必须使用：情绪词（烦死了、气死我了、无语）；口语强调（就、真是、也太）；反问句式。
    - 可以有：夸张表达、省略主语、重复强调。
    - 风格：像在跟朋友抱怨一样。
    【NICE】
    - 有转折或自嘲。

# ========== L: 有缺陷AI文本 ==========

- id: L_incomplete_001
  scenario_id: L
  style_plan: mixed
  length_bucket: 80-200
  notes: "不完整文本"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约100–180字。
    - 写一段关于{主题}的文字，故意写得不完整。
    - 必须有：句子中断（写到一半不写了）；省略号结尾；或者突然转换话题。
    - 模拟：打字到一半被打断、思路断了、或者懒得写完整。
    【NICE】
    - 有开头铺垫但没有结论。

- id: L_repetitive_002
  scenario_id: L
  style_plan: mixed
  length_bucket: 200-500
  notes: "重复啰嗦文本"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约250–450字。
    - 写一段关于{主题}的文字，故意写得重复啰嗦。
    - 必须有：同义词重复（好、不错、挺好的）；同一个意思用不同方式说2-3遍；多余的过渡词。
    - 模拟：思路不清晰、或者为了凑字数。
    【NICE】
    - 有明显的车轱辘话。

- id: L_grammar_error_003
  scenario_id: L
  style_plan: mixed
  length_bucket: 200-500
  notes: "语法不通顺"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约250–450字。
    - 写一段关于{主题}的文字，故意包含一些语法问题。
    - 必须有：搭配不当（1-2处）；语序不顺（1处）；或缺少主语/宾语。
    - 模拟：打字太快没检查、或者表达能力有限。
    - 注意：不要太明显的错别字，主要是语法层面。
    【NICE】
    - 整体意思能懂但读起来别扭。

- id: L_logic_jump_004
  scenario_id: L
  style_plan: mixed
  length_bucket: 200-500
  notes: "逻辑跳跃"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约250–450字。
    - 写一段关于{主题}的文字，故意有逻辑跳跃。
    - 必须有：话题突然跳转（不加过渡）；结论和论据不太匹配；或者因果关系牵强。
    - 模拟：思维发散、联想丰富但不严谨。
    【NICE】
    - 每个段落单独看OK但连起来有跳跃。

- id: L_mixed_style_005
  scenario_id: L
  style_plan: mixed
  length_bucket: 200-500
  notes: "风格混乱"
  template: |
    【MUST】
    - 只输出正文，不输出任务说明/格式说明。
    - 不得出现：作为AI/语言模型、我无法/我不能、我建议、免责声明/拒绝表述。
    - 字数约250–450字。
    - 写一段关于{主题}的文字，故意风格不统一。
    - 必须有：开头正式、中间口语、结尾又正式；或者穿插网络用语和书面语。
    - 模拟：写作时心态变化、或者拼凑不同来源。
    【NICE】
    - 风格切换有2-3次。
